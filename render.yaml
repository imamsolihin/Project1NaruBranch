services:
  - type: web
    name: narubranch-web
    env: docker
    envVars:
      - key: APP_NAME
        value: NaruBranch
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: true
      - key: APP_KEY
        value: base64:QmO0bjKWqqpj+E9jzz4c9F1ploYlebDjTOIX3KI/5ZU=
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_URL
        fromDatabase:
          name: narubranch-db
          property: connectionString
      - key: PORT
        value: 10000

databases:
  - name: narubranch-db
    databaseName: narubranch
    user: narubranch_user
    plan: free

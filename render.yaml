services:
  - type: web
    name: narubranch-web
    env: php
    buildCommand: composer install --no-dev --optimize-autoloader && npm install && npm run build
    startCommand: php artisan serve --host=0.0.0.0 --port=$PORT
    envVars:
      - key: APP_NAME
        value: NaruBranch
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: APP_KEY
        generateValue: true
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_URL
        fromDatabase:
          name: narubranch-db
          property: connectionString
      - key: PORT
        value: 10000

databases:
  - name: narubranch-db
    databaseName: narubranch
    user: narubranch_user
    plan: free
